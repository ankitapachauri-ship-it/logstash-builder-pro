# ── IAP header sanitiser ───────────────────────────────────────────────────────
# Google IAP sets X-Goog-Authenticated-User-Email to "accounts.google.com:user@elastic.co".
# Whitelist-filter prevents header injection / XSS if nginx is hit without IAP.
map $http_x_goog_authenticated_user_email $safe_iap_user {
    ~^[A-Za-z0-9@.:_\-]+$ $http_x_goog_authenticated_user_email;
    default                "";
}

# ── Per-request CSP nonce (F-01) ──────────────────────────────────────────────
# $request_id is a unique hex string per request — safe to use as a nonce.
map $request_id $csp_nonce {
    default $request_id;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Long-lived cache for hashed assets (Vite fingerprints JS/CSS filenames)
    # F-03: repeat ALL security headers here — nginx drops parent add_header
    #       directives when any child location block adds its own header.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control             "public, immutable"                         always;
        add_header X-Content-Type-Options    "nosniff"                                   always;
        add_header X-Frame-Options           "SAMEORIGIN"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"  always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"       always;
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html so React Router works.
    # F-01: Content-Security-Policy with per-request nonce for the IAP inline script.
    # F-03: All security headers repeated (nginx inheritance rule).
    # F-04: no-store prevents a proxy from caching a user's IAP identity HTML.
    location / {
        add_header X-Content-Type-Options    "nosniff"                                   always;
        add_header X-Frame-Options           "SAMEORIGIN"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"  always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"       always;
        add_header Cache-Control             "no-store, no-cache, must-revalidate"       always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.anthropic.com https://api.jina.ai; img-src 'self' data:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

        sub_filter '<head>' '<head><script nonce="$csp_nonce">window.__IAP_USER__="$safe_iap_user";</script>';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
