server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Long-lived cache for hashed assets (Vite fingerprints JS/CSS filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html so React Router works
    # Inject the IAP-provided user email into the page so the app can read it.
    # $http_x_goog_authenticated_user_email is set by Google IAP on every
    # authenticated request ("accounts.google.com:user@elastic.co").
    # When IAP is not in front of nginx (local Docker test), the variable is
    # empty — the app falls back to "dev@localhost" in that case.
    location / {
        sub_filter '<head>' '<head><script>window.__IAP_USER__="$http_x_goog_authenticated_user_email";</script>';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
