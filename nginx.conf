# ── IAP header sanitiser ───────────────────────────────────────────────────────
# Google IAP sets X-Goog-Authenticated-User-Email to "accounts.google.com:user@elastic.co".
# We inject this into the page as window.__IAP_USER__ so the SPA can read it.
#
# SECURITY: The raw header value is filtered through a whitelist map before
# injection.  Only values that consist entirely of safe email/IAP characters
# (letters, digits, @, ., :, -, _) are forwarded; anything else becomes "".
# This prevents header-injection / XSS if nginx is hit directly without IAP.
map $http_x_goog_authenticated_user_email $safe_iap_user {
    ~^[A-Za-z0-9@.:_\-]+$ $http_x_goog_authenticated_user_email;
    default                "";
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── HTTP security headers ────────────────────────────────────────────────
    # Applied globally; individual locations may extend with Cache-Control etc.
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Long-lived cache for hashed assets (Vite fingerprints JS/CSS filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html so React Router works.
    # Injects the sanitised IAP email as window.__IAP_USER__ at request time.
    # $safe_iap_user is guaranteed to contain only [A-Za-z0-9@.:_-] or "".
    location / {
        sub_filter '<head>' '<head><script>window.__IAP_USER__="$safe_iap_user";</script>';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
